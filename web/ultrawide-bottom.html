<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawide Bottom Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
    <link rel="stylesheet" href="/src/styles/ultrawide.css" />
  </head>
  <body class="uw-bar-only" data-uw-mode="bottom">
    <div id="uw-stage" data-atm="on" data-vfx="on" data-text-fx="on">
      <div class="uw-bar uw-bar-bottom" id="uw-bottom" data-edge="bottom">
        <div class="uw-seam uw-seam-top" aria-hidden="true"></div>
        <div class="uw-smoke-depth" aria-hidden="true"></div>
        <div class="uw-bar-haze uw-bar-haze-footer" aria-hidden="true"></div>
        <div class="uw-grime" aria-hidden="true">
          <i class="uw-scratch c"></i>
          <i class="uw-blood c"></i>
        </div>
        <div class="uw-bar-body uw-wall-footer">
          <div class="uw-side">
            <div class="uw-footer-vent" aria-hidden="true">
              <div class="uw-vent-face"><i></i><i></i><i></i></div>
              <span class="uw-vent-wisp"></span>
            </div>
          </div>
          <div class="uw-center">
            <div class="uw-hold-line" data-text-fx="hold">
              <span class="uw-plate-lit" aria-hidden="true"></span>
              <div class="uw-title" id="uw-bottom-text">
                <span class="uw-text-glow" aria-hidden="true"></span>
                <span class="uw-text-face">HOLD THE LINE</span>
              </div>
            </div>
            <span class="uw-footer-drift a" aria-hidden="true"></span>
            <span class="uw-footer-drift b" aria-hidden="true"></span>
          </div>
          <div class="uw-side uw-side-right">
            <div class="uw-status" data-text-fx="status" id="uw-bottom-status">
              <span class="uw-status-fixture" aria-hidden="true"><i class="uw-status-led"></i></span>
              <span class="uw-text-glow" aria-hidden="true"></span>
              <span class="uw-text-face">ZONE THREAT // RAID READY</span>
            </div>
          </div>
        </div>
        <div class="uw-atm-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/pages/ultrawide.ts"></script>
  </body>
</html>
