<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be Right Back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
  </head>
  <body class="scene-opaque">
    <div id="stage">
      <div class="signal-noise" aria-hidden="true"></div>
      <div class="scene-terminal">
        <div class="terminal-panel">
          <div class="rad-stamp">HOLD<br />ZONE</div>
          <div class="terminal-eyebrow">FIELD TERMINAL // HOLD</div>
          <h1 class="terminal-title" id="scene-title">OPERATOR AWAY</h1>
          <p class="terminal-sub" id="scene-sub">Hold position. Transmission resumes shortly.</p>
          <p class="terminal-sub" style="margin-bottom: 0">
            Callsign: <span data-streamer-name>datguydaz</span>
          </p>
        </div>
      </div>
      <div class="module" id="mod-avatar">
        <div id="avatar-mount"></div>
      </div>
      <div class="conn-pill" id="conn-pill" data-state="offline">INPUT // IDLE</div>
    </div>
    <script type="module" src="/src/pages/brb.ts"></script>
  </body>
</html>
