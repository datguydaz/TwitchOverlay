<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawide Top Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
    <link rel="stylesheet" href="/src/styles/ultrawide.css" />
  </head>
  <body class="uw-bar-only" data-uw-mode="top">
    <div id="uw-stage" data-atm="on" data-vfx="on" data-text-fx="on">
      <div class="uw-bar uw-bar-top" id="uw-top" data-edge="top">
        <div class="uw-console-wear" aria-hidden="true">
          <i class="uw-wear-patch flake-a"></i>
          <i class="uw-wear-patch flake-b"></i>
          <i class="uw-wear-patch corr-a"></i>
          <i class="uw-wear-patch corr-b"></i>
          <i class="uw-wear-patch streak-a"></i>
          <i class="uw-wear-patch soot-a"></i>
          <i class="uw-chip a"></i><i class="uw-chip b"></i>
          <i class="uw-dent"></i>
          <i class="uw-bolt a"></i><i class="uw-bolt b"></i>
          <i class="uw-bolt c"></i><i class="uw-bolt d"></i>
          <i class="uw-blood"></i>
        </div>
        <div class="uw-bar-body uw-console-header">
          <div class="uw-side" id="uw-follower-slot">
            <aside class="uw-readout uw-social-inbar" id="uw-follower">
              <div class="uw-readout-shell">
                <div class="uw-readout-label" data-text-fx="follow-label">
                  <span class="uw-text-glow" aria-hidden="true"></span>
                  <span class="uw-text-face">LATEST FOLLOW</span>
                </div>
                <div class="uw-readout-value" data-text-fx="follow-name">
                  <span class="uw-text-glow" aria-hidden="true"></span>
                  <span class="uw-text-face" id="uw-follower-name"></span>
                </div>
              </div>
            </aside>
            <div class="uw-conduit" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>

          <div class="uw-center">
            <div class="uw-housing" id="uw-top-text">
              <div class="uw-housing-face">
                <div class="uw-id-name" data-text-fx="id">
                  <span class="uw-text-glow" aria-hidden="true"></span>
                  <span class="uw-text-face" data-streamer-name>datguydaz</span>
                </div>
              </div>
              <div class="uw-op-strip" data-text-fx="op">
                <span class="uw-op-led" aria-hidden="true"></span>
                <span class="uw-text-glow" aria-hidden="true"></span>
                <span class="uw-text-face" id="uw-operator-suffix">OPERATOR ONLINE</span>
              </div>
              <div class="uw-utility" aria-hidden="true">
                <div class="uw-grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <div class="uw-lamp">
                  <span class="uw-lamp-bulb"></span>
                  <span class="uw-lamp-spill"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="uw-side uw-side-right" id="uw-subscriber-slot">
            <div class="uw-conduit" aria-hidden="true"><span></span><span></span><span></span></div>
            <aside class="uw-readout uw-social-inbar" id="uw-subscriber">
              <div class="uw-readout-shell">
                <div class="uw-readout-label" data-text-fx="sub-label">
                  <span class="uw-text-glow" aria-hidden="true"></span>
                  <span class="uw-text-face">LATEST SUB</span>
                </div>
                <div class="uw-readout-value" data-text-fx="sub-name">
                  <span class="uw-text-glow" aria-hidden="true"></span>
                  <span class="uw-text-face" id="uw-subscriber-name"></span>
                </div>
              </div>
            </aside>
          </div>
        </div>
        <div class="uw-seam uw-seam-bottom" aria-hidden="true"></div>
        <div class="uw-atm-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/pages/ultrawide.ts"></script>
  </body>
</html>
