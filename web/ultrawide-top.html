<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawide Top Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
    <link rel="stylesheet" href="/src/styles/ultrawide.css" />
  </head>
  <body class="uw-bar-only" data-uw-mode="top">
    <div id="uw-stage" data-atm="on" data-vfx="on" data-text-fx="on">
      <div class="uw-bar uw-bar-top" id="uw-top" data-edge="top">
        <div class="uw-wall-wear" aria-hidden="true">
          <i class="uw-wear-patch flake-a"></i>
          <i class="uw-wear-patch flake-b"></i>
          <i class="uw-wear-patch corr-a"></i>
          <i class="uw-wear-patch streak-a"></i>
          <i class="uw-wear-patch soot-a"></i>
          <i class="uw-stain a"></i><i class="uw-stain b"></i>
          <i class="uw-blood"></i>
        </div>
        <div class="uw-bar-body uw-wall-header">
          <div class="uw-side" id="uw-follower-slot">
            <aside class="uw-glass uw-social-inbar" id="uw-follower" data-social="follow">
              <span class="uw-glass-fixture" aria-hidden="true"><i class="uw-glass-ind"></i></span>
              <div class="uw-glass-label">LATEST FOLLOW</div>
              <div class="uw-glass-well">
                <span class="uw-glass-scan" aria-hidden="true"></span>
                <span class="uw-glass-glow" aria-hidden="true"></span>
                <span class="uw-glass-name" id="uw-follower-name"></span>
              </div>
            </aside>
          </div>

          <div class="uw-center">
            <div class="uw-steel-sign" id="uw-top-text">
              <div class="uw-stencil" data-text-fx="id">
                <span class="uw-text-glow" aria-hidden="true"></span>
                <span class="uw-text-face" data-streamer-name>datguydaz</span>
              </div>
              <div class="uw-op-readout" data-text-fx="op">
                <span class="uw-op-fixture" aria-hidden="true"><i class="uw-op-led"></i></span>
                <span class="uw-text-glow" aria-hidden="true"></span>
                <span class="uw-text-face" id="uw-operator-suffix">OPERATOR ONLINE</span>
              </div>
              <div class="uw-util-lamp" aria-hidden="true">
                <span class="uw-lamp-cage"></span>
                <span class="uw-lamp-bulb"></span>
                <span class="uw-lamp-spill"></span>
              </div>
            </div>
          </div>

          <div class="uw-side uw-side-right" id="uw-subscriber-slot">
            <aside class="uw-glass uw-social-inbar" id="uw-subscriber" data-social="sub">
              <span class="uw-glass-fixture" aria-hidden="true"><i class="uw-glass-ind"></i></span>
              <div class="uw-glass-label">LATEST SUB</div>
              <div class="uw-glass-well">
                <span class="uw-glass-scan" aria-hidden="true"></span>
                <span class="uw-glass-glow" aria-hidden="true"></span>
                <span class="uw-glass-name" id="uw-subscriber-name"></span>
              </div>
            </aside>
          </div>
        </div>
        <div class="uw-seam uw-seam-bottom" aria-hidden="true"></div>
        <div class="uw-atm-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/pages/ultrawide.ts"></script>
  </body>
</html>
