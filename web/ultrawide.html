<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawide Letterbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
    <link rel="stylesheet" href="/src/styles/ultrawide.css" />
  </head>
  <body>
    <div id="uw-stage" data-atm="on" data-vfx="on">
      <div class="uw-bar uw-bar-top" id="uw-top" data-edge="top">
        <div class="uw-bar-body">
          <div class="uw-side" id="uw-follower-slot">
            <aside class="uw-social uw-social-inbar" id="uw-follower">
              <span class="uw-social-bezel" aria-hidden="true">
                <i class="uw-screw tl"></i><i class="uw-screw tr"></i>
                <i class="uw-screw bl"></i><i class="uw-screw br"></i>
                <i class="uw-s-chip a"></i><i class="uw-s-chip b"></i><i class="uw-s-chip c"></i>
                <i class="uw-s-scratch a"></i><i class="uw-s-scratch b"></i><i class="uw-s-scratch c"></i>
                <i class="uw-s-paint"></i><i class="uw-s-rust"></i><i class="uw-s-grime"></i>
              </span>
              <div class="uw-social-well">
                <div class="uw-social-tag">LATEST FOLLOW</div>
                <div class="uw-social-name" id="uw-follower-name"></div>
              </div>
            </aside>
          </div>
          <div class="uw-center">
            <div class="uw-id-plate" id="uw-top-text">
              <span class="uw-id-bezel" aria-hidden="true">
                <i class="uw-screw tl"></i><i class="uw-screw tr"></i>
                <i class="uw-screw bl"></i><i class="uw-screw br"></i>
                <i class="uw-s-chip a"></i><i class="uw-s-scratch a"></i>
                <i class="uw-s-paint"></i><i class="uw-s-rust"></i>
              </span>
              <div class="uw-id-well">
                <div class="uw-id-name" data-streamer-name>datguydaz</div>
                <div class="uw-op-line">
                  <span class="uw-op-led" aria-hidden="true"></span>
                  <span id="uw-operator-suffix">OPERATOR ONLINE</span>
                </div>
              </div>
            </div>
            <div class="uw-rule" aria-hidden="true"></div>
          </div>
          <div class="uw-side uw-side-right" id="uw-subscriber-slot">
            <aside class="uw-social uw-social-inbar" id="uw-subscriber">
              <span class="uw-social-bezel" aria-hidden="true">
                <i class="uw-screw tl"></i><i class="uw-screw tr"></i>
                <i class="uw-screw bl"></i><i class="uw-screw br"></i>
                <i class="uw-s-chip a"></i><i class="uw-s-chip b"></i><i class="uw-s-chip c"></i>
                <i class="uw-s-scratch a"></i><i class="uw-s-scratch b"></i><i class="uw-s-scratch c"></i>
                <i class="uw-s-paint"></i><i class="uw-s-rust"></i><i class="uw-s-grime"></i>
              </span>
              <div class="uw-social-well">
                <div class="uw-social-tag">LATEST SUB</div>
                <div class="uw-social-name" id="uw-subscriber-name"></div>
              </div>
            </aside>
          </div>
          <span class="uw-tick uw-tick-l" aria-hidden="true"></span>
          <span class="uw-tick uw-tick-r" aria-hidden="true"></span>
          <div class="uw-scan" aria-hidden="true"></div>
        </div>
        <div class="uw-hazard-rail" aria-hidden="true"></div>
      </div>

      <div class="uw-bar uw-bar-bottom" id="uw-bottom" data-edge="bottom">
        <div class="uw-hazard-rail" aria-hidden="true"></div>
        <div class="uw-bar-body">
          <div class="uw-side" aria-hidden="true"></div>
          <div class="uw-center">
            <div class="uw-title" id="uw-bottom-text">HOLD THE LINE</div>
            <div class="uw-rule" aria-hidden="true"></div>
          </div>
          <div class="uw-side uw-side-right">
            <div class="uw-status" id="uw-bottom-status">ZONE THREAT // RAID READY</div>
            <div class="uw-meta">EQ LABEL // DESK LIVE</div>
          </div>
          <span class="uw-tick uw-tick-l" aria-hidden="true"></span>
          <span class="uw-tick uw-tick-r" aria-hidden="true"></span>
          <div class="uw-scan" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pages/ultrawide.ts"></script>
  </body>
</html>
