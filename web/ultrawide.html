<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawide Letterbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles/zone.css" />
    <link rel="stylesheet" href="/src/styles/ultrawide.css" />
  </head>
  <body>
    <div id="uw-stage" data-vfx="on">
      <div class="uw-bar uw-bar-top" id="uw-top" data-edge="top">
        <div class="uw-bar-body">
          <div class="uw-side">
            <div class="uw-brand">ZONE OPS</div>
            <div class="uw-callsign">FIELD NET</div>
            <div class="uw-meta">CH-01 // SECURE</div>
          </div>
          <div class="uw-center">
            <div class="uw-title" id="uw-top-text">ZONE OPS // TRANSMISSION</div>
            <div class="uw-rule" aria-hidden="true"></div>
          </div>
          <div class="uw-side uw-side-right">
            <div class="uw-status" id="uw-top-status">SIGNAL NOMINAL</div>
            <div class="uw-meta">UPLINK STABLE</div>
          </div>
          <span class="uw-tick uw-tick-l" aria-hidden="true"></span>
          <span class="uw-tick uw-tick-r" aria-hidden="true"></span>
          <div class="uw-scan" aria-hidden="true"></div>
        </div>
        <div class="uw-hazard-rail" aria-hidden="true"></div>
      </div>

      <div class="uw-bar uw-bar-bottom" id="uw-bottom" data-edge="bottom">
        <div class="uw-hazard-rail" aria-hidden="true"></div>
        <div class="uw-bar-body">
          <div class="uw-side">
            <div class="uw-brand">OPERATOR</div>
            <div class="uw-callsign" data-streamer-name>datguydaz</div>
            <div class="uw-meta">AUTH // LOCAL</div>
          </div>
          <div class="uw-center">
            <div class="uw-title" id="uw-bottom-text">
              <span data-streamer-name>datguydaz</span> // OPERATOR ONLINE
            </div>
            <div class="uw-rule" aria-hidden="true"></div>
          </div>
          <div class="uw-side uw-side-right">
            <div class="uw-status" id="uw-bottom-status">SIGNAL NOMINAL</div>
            <div class="uw-meta">DESK LIVE</div>
          </div>
          <span class="uw-tick uw-tick-l" aria-hidden="true"></span>
          <span class="uw-tick uw-tick-r" aria-hidden="true"></span>
          <div class="uw-scan" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pages/ultrawide.ts"></script>
  </body>
</html>
